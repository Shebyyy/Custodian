name: Deploy Custodian to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 180s
          script_stop: false
          script: |
            set -e
            echo "=== Deploying Custodian ==="

            # Install bun if missing
            echo "[1/6] Checking bun..."
            if ! which bun; then
              echo "Installing bun..."
              curl -fsSL https://bun.sh/install | bash
            fi
            export PATH="$HOME/.bun/bin:$PATH"
            echo "OK: bun available ($(bun --version))"

            # Clone or pull
            echo "[2/6] Fetching code..."

            # Save old PID BEFORE git clean wipes it
            OLD_BOT_PID=""
            if [ -f /root/Custodian/data/bot.pid ]; then
              OLD_BOT_PID=$(cat /root/Custodian/data/bot.pid)
            fi

            if [ -d /root/Custodian/.git ]; then
              cd /root/Custodian
              git fetch origin main
              git clean -fd
              git reset --hard origin/main
            else
              rm -rf /root/Custodian
              git clone -b main https://github.com/${{ github.repository }}.git /root/Custodian
            fi

            # Kill old process using saved PID (if it's still alive)
            if [ -n "$OLD_BOT_PID" ] && kill -0 "$OLD_BOT_PID" 2>/dev/null; then
              kill -9 "$OLD_BOT_PID" 2>/dev/null || true
              echo "Stopped old process (PID: $OLD_BOT_PID)"
              sleep 2
            fi

            # Safety net: kill anything still holding port 4000 (OAuth callback)
            if command -v fuser &>/dev/null; then
              fuser -k 4000/tcp 2>/dev/null || true
            elif command -v lsof &>/dev/null; then
              lsof -ti:4000 | xargs kill -9 2>/dev/null || true
            fi

            echo "OK: code fetched"

            # Install deps
            echo "[3/6] Installing dependencies..."
            cd /root/Custodian
            rm -rf node_modules
            bun install
            echo "OK: deps installed"

            # Write .env from secrets
            echo "[4/6] Writing .env..."
            printf 'DISCORD_BOT_TOKEN=%s\n' \
              '${{ secrets.DISCORD_BOT_TOKEN }}' \
              > /root/Custodian/.env
            # Only add OAuth2 secrets if they exist
            if [ -n '${{ secrets.OAUTH2_CLIENT_SECRET }}' ]; then
              printf 'OAUTH2_CLIENT_SECRET=%s\n' '${{ secrets.OAUTH2_CLIENT_SECRET }}' >> /root/Custodian/.env
            fi
            if [ -n '${{ secrets.OAUTH2_REDIRECT_URI }}' ]; then
              printf 'OAUTH2_REDIRECT_URI=%s\n' '${{ secrets.OAUTH2_REDIRECT_URI }}' >> /root/Custodian/.env
            fi
            chmod 600 /root/Custodian/.env
            echo "OK: .env written"

            # Create data dir + setup database
            echo "[5/6] Setting up database..."
            mkdir -p /root/Custodian/data
            cd /root/Custodian
            bun run db:setup
            echo "OK: database ready"

            # Kill old bot using PID file (safe — won't match script itself)
            echo "[6/6] Restarting bot..."
            if [ -f /root/Custodian/data/bot.pid ]; then
              OLD_PID=$(cat /root/Custodian/data/bot.pid)
              if kill -0 "$OLD_PID" 2>/dev/null; then
                kill -9 "$OLD_PID" 2>/dev/null || true
                echo "Stopped old process (PID: $OLD_PID)"
              fi
              rm -f /root/Custodian/data/bot.pid
            else
              echo "No PID file found — skipping kill"
            fi
            sleep 2

            # Start
            setsid bun run /root/Custodian/src/index.ts > /root/Custodian/data/bot.log 2>&1 &
            echo $! > /root/Custodian/data/bot.pid
            sleep 5

            # Health check
            echo "Health check..."
            if kill -0 $(cat /root/Custodian/data/bot.pid) 2>/dev/null; then
              echo "✅ Custodian is running (PID: $(cat /root/Custodian/data/bot.pid))"
            else
              echo "❌ Custodian failed to start!"
              cat /root/Custodian/data/bot.log
              exit 1
            fi
